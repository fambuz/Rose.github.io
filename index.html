<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You &lt;3</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a0514;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="flowerCanvas" width="600" height="700"></canvas>

  <script>
    const canvas = document.getElementById("flowerCanvas");
    const ctx = canvas.getContext("2d");

    const WORD = "my love";

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2 - 30;

    function resetTransform() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.translate(centerX, centerY);
    }

    function drawWord(x, y, color, font = "bold 8px Arial") {
      resetTransform();
      ctx.fillStyle = color;
      ctx.font = font;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(WORD, x, -y);
    }

    function getPetalPoints(baseX, baseY, baseAngleRad, length, width, points = 26) {
      const cosA = Math.cos(baseAngleRad);
      const sinA = Math.sin(baseAngleRad);
      const list = [];

      for (let i = 0; i <= points; i++) {
        const theta = (i * Math.PI) / points;
        const out = length * Math.sin(theta);
        const side = width * Math.sin(theta) * Math.cos(theta);

        const rx = out * cosA - side * sinA;
        const ry = out * sinA + side * cosA;

        list.push({ x: baseX + rx, y: baseY + ry });
      }
      return list;
    }

    const drawQueue = [];

    // Helper for stem segments
    function queueStemSegment(startX, startY, controlX, controlY, endX, endY, steps = 15) {
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const prevT = (i - 1) / steps;

        const x = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * controlX + t * t * endX;
        const y = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * controlY + t * t * endY;

        const prevX = (1 - prevT) * (1 - prevT) * startX + 2 * (1 - prevT) * prevT * controlX + prevT * prevT * endX;
        const prevY = (1 - prevT) * (1 - prevT) * startY + 2 * (1 - prevT) * prevT * controlY + prevT * prevT * endY;

        drawQueue.push(() => {
          resetTransform();
          ctx.strokeStyle = "#2e8b57";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(prevX, -prevY);
          ctx.lineTo(x, -y);
          ctx.stroke();
        });
      }
    }

    function queueLeaf(baseX, baseY, angleDeg, length, width) {
      const pts = getPetalPoints(baseX, baseY, (angleDeg * Math.PI) / 180, length, width, 22);
      pts.forEach(pt => {
        drawQueue.push(() => drawWord(pt.x, pt.y, "#2e8b57"));
      });
    }

    // --- 1. Draw Stem Segment 1 -> Leaf 1 -> Stem Segment 2 -> Leaf 2 -> Stem Segment 3 ---
    queueStemSegment(0, -30, 10, -80, 12, -100, 12);
    queueLeaf(12, -100, 160, 50, 25);

    queueStemSegment(12, -100, 0, -140, -15, -175, 12);
    queueLeaf(-15, -175, 20, 55, 28);

    queueStemSegment(-15, -175, -25, -210, -40, -250, 12);

    // --- 2. Petal Rings ---
    const rings = [
      { radius: 0,  count: 4,  length: 40,  width: 15, color: "#ffe6f2", offset: 45 },
      { radius: 10, count: 5,  length: 50,  width: 25, color: "#ffb3d9", offset: 0  },
      { radius: 20, count: 7,  length: 70,  width: 35, color: "#ff66b2", offset: 30 },
      { radius: 30, count: 9,  length: 90,  width: 45, color: "#ff1493", offset: 15 },
      { radius: 40, count: 12, length: 110, width: 55, color: "#c71585", offset: 0  }
    ];

    rings.forEach(ring => {
      for (let i = 0; i < ring.count; i++) {
        const angleDeg = (360 / ring.count) * i + ring.offset;
        const angleRad = (angleDeg * Math.PI) / 180;

        const baseX = ring.radius * Math.cos(angleRad);
        const baseY = ring.radius * Math.sin(angleRad);

        const pts = getPetalPoints(baseX, baseY, angleRad, ring.length, ring.width);
        pts.forEach(pt => {
          drawQueue.push(() => drawWord(pt.x, pt.y, ring.color));
        });
      }
    });

    // --- 3. Floating Hearts Background ---
    for (let i = 0; i < 12; i++) {
      const x = Math.floor(Math.random() * 500) - 250;
      const y = Math.floor(Math.random() * 500) - 250;
      if (Math.hypot(x, y) > 130) {
        drawQueue.push(() => {
          resetTransform();
          ctx.fillStyle = "#ff99cc";
          ctx.font = "bold 10px Courier";
          ctx.textAlign = "center";
          ctx.fillText("<3", x, -y);
        });
      }
    }

    // --- 4. Subtitle ---
    drawQueue.push(() => {
      resetTransform();
      ctx.fillStyle = "white";
      ctx.font = "italic 10px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Click anywhere to close", 0, 320);
    });

    // --- Speed matching your video (~20 seconds total run time) ---
    const ITEMS_PER_FRAME = 1;

    function animate() {
      if (drawQueue.length > 0) {
        for (let i = 0; i < ITEMS_PER_FRAME && drawQueue.length > 0; i++) {
          const step = drawQueue.shift();
          step();
        }
        requestAnimationFrame(animate);
      }
    }

    animate();
  </script>

</body>
</html>
